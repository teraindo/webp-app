<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>트윗 영상 다운로드 · WebP 변환기</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#0f1115; --card:#191c23; --line:#2a2f3a; --text:#e9ecf2; --sub:#9aa3b2;
    --accent:#4f8cff; --accent2:#2f6be0; --ok:#3ecf8e; --warn:#ffb547; --err:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.45}
  main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
  h1{font-size:19px;margin:4px 2px 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:600}
  .pick{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border:2px dashed var(--line);
    border-radius:12px;color:var(--text);font-size:16px;cursor:pointer;background:transparent}
  .pick:active{background:#1f2430}
  .pickwrap{position:relative;overflow:hidden;border-radius:12px}
  .pickwrap input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px;z-index:2}
  video{width:100%;max-height:52vh;background:#000;border-radius:10px;display:block}
  .stage{position:relative}
  .cropLayer{position:absolute;inset:0;overflow:hidden;border-radius:10px;touch-action:none}
  .cropBox{position:absolute;border:2px solid #fff;touch-action:none;
    background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);
    background-size:33.333% 33.333%;background-position:-1px -1px}
  .shade{position:absolute;background:rgba(0,0,0,.6);pointer-events:none}
  .hnd{position:absolute;width:26px;height:26px;background:#fff;border:3px solid var(--accent);border-radius:50%;touch-action:none}
  .hnd.tl{left:-4px;top:-4px}.hnd.tr{right:-4px;top:-4px}.hnd.bl{left:-4px;bottom:-4px}.hnd.br{right:-4px;bottom:-4px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#232835;color:var(--text);font-size:13px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .between{justify-content:space-between}
  .btn{appearance:none;border:1px solid var(--line);background:#232835;color:var(--text);border-radius:10px;
    padding:10px 12px;font-size:14px;cursor:pointer;touch-action:manipulation}
  .btn:active{background:#2c3344}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:14px;width:100%}
  .btn.primary:active{background:var(--accent2)}
  .btn.small{padding:8px 10px;font-size:13px}
  .btn:disabled{opacity:.45}
  .grow{flex:1}
  .timebox{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
  .label{color:var(--sub);font-size:13px}
  input[type=range]{width:100%;accent-color:var(--accent);height:28px}
  .track{position:relative;height:10px;background:#262b36;border-radius:6px;margin:10px 0 4px;overflow:hidden}
  .sel{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.75}
  .head{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field label{display:block;color:var(--sub);font-size:13px;margin-bottom:4px}
  select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#232835;color:var(--text);font-size:14px}
  .check{display:flex;align-items:center;gap:8px;padding:6px 0}
  .check input{width:20px;height:20px;accent-color:var(--accent)}
  .info{color:var(--sub);font-size:13px;margin-top:8px}
  .warn{color:var(--warn)}
  .err{color:var(--err)}
  .bar{height:10px;background:#262b36;border-radius:6px;overflow:hidden;margin:8px 0}
  .bar > div{height:100%;width:0;background:var(--ok);transition:width .15s}
  .result img{max-width:100%;border-radius:10px;display:block;margin:0 auto 10px;background:
    repeating-conic-gradient(#2a2f3a 0 25%, #20242d 0 50%) 0 0/16px 16px}
  .hidden{display:none !important}
  input[type=text].num{width:96px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#232835;color:var(--text);
    font-size:16px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .num:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  input[type=url],input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#232835;color:var(--text);font-size:15px}
  .vid{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
  .vid img{width:100%;max-height:40vh;object-fit:contain;background:#000;border-radius:10px;display:block;margin-bottom:8px}
  .q{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap}
  .q .ql{flex:1;min-width:110px;font-variant-numeric:tabular-nums}
  a.link{color:var(--accent)}
  .tweettext{color:var(--sub);font-size:13px;margin:6px 0 4px;white-space:pre-wrap;max-height:4.5em;overflow:hidden}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 14px;
    border-radius:10px;font-size:14px;z-index:9;max-width:90vw;text-align:center}
</style>
</head>
<body>
<main>
  <h1>🎞️ 트윗 영상 다운로드 · WebP 변환</h1>

  <div id="unsupported" class="card hidden">
    <p class="err" style="margin:0">이 브라우저는 WebP 저장(인코딩)을 지원하지 않습니다. 안드로이드 크롬이나 Claude 안드로이드 앱에서 열어 주세요.</p>
  </div>

  <!-- 0. 트위터 -->
  <div class="card">
    <h2>🐦 트위터(X) 링크로 영상 가져오기</h2>
    <input id="tw" type="url" inputmode="url" placeholder="https://x.com/.../status/..." autocomplete="off">
    <div class="row" style="margin-top:8px">
      <button class="btn small" id="pasteBtn">📋 붙여넣기</button>
      <button class="btn grow" id="twBtn" style="background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700">가져오기</button>
    </div>
    <div id="twStatus" class="info"></div>
    <div id="twList"></div>
  </div>

  <!-- 1. 파일 선택 -->
  <div class="card">
    <h2>📁 또는 폰에 있는 동영상</h2>
    <div class="pickwrap">
      <div class="pick">📁 동영상 선택</div>
      <input id="file" type="file" accept="video/*,.mp4,.mov,.webm,.mkv,.3gp">
    </div>
    
    <div id="fileInfo" class="info hidden"></div>
  </div>

  <!-- 2. 구간 편집 -->
  <div id="editor" class="card hidden">
    <h2>✂️ 구간 편집</h2>
    <div class="stage" id="stage">
      <video id="video" playsinline muted preload="auto"></video>
      <div class="cropLayer hidden" id="cropLayer">
        <div class="shade" id="shT"></div><div class="shade" id="shB"></div><div class="shade" id="shL"></div><div class="shade" id="shR"></div>
        <div class="cropBox" id="cropBox">
          <div class="hnd tl" data-h="tl"></div><div class="hnd tr" data-h="tr"></div>
          <div class="hnd bl" data-h="bl"></div><div class="hnd br" data-h="br"></div>
        </div>
      </div>
    </div>

    <div class="track" id="track"><div class="sel" id="selBar"></div><div class="head" id="headBar"></div></div>
    <div class="row between label"><span id="curTime">0.00초</span><span id="durTime">/ 0.00초</span></div>

    <div class="row" style="margin-top:8px">
      <button class="btn small" id="back1">−1초</button>
      <button class="btn small" id="backF">−0.1</button>
      <button class="btn grow" id="playBtn">▶ 재생</button>
      <button class="btn small" id="fwdF">+0.1</button>
      <button class="btn small" id="fwd1">+1초</button>
    </div>

    <div style="margin-top:14px">
      <div class="row between"><span class="label">시작</span><span class="row" style="gap:6px"><input id="startNum" class="num" type="text" inputmode="decimal" enterkeyhint="done" value="0.00"><span class="label">초</span></span></div>
      <input type="range" id="startR" min="0" max="1" step="0.01" value="0">
      <div class="row">
        <button class="btn small" id="sMinus">−0.1</button>
        <button class="btn small" id="sPlus">+0.1</button>
        <button class="btn small grow" id="setStart">📍 현재 위치를 시작으로</button>
      </div>
    </div>

    <div style="margin-top:14px">
      <div class="row between"><span class="label">끝</span><span class="row" style="gap:6px"><input id="endNum" class="num" type="text" inputmode="decimal" enterkeyhint="done" value="0.00"><span class="label">초</span></span></div>
      <input type="range" id="endR" min="0" max="1" step="0.01" value="1">
      <div class="row">
        <button class="btn small" id="eMinus">−0.1</button>
        <button class="btn small" id="ePlus">+0.1</button>
        <button class="btn small grow" id="setEnd">📍 현재 위치를 끝으로</button>
      </div>
    </div>

    <div class="row" style="margin-top:12px">
      <button class="btn grow" id="loopBtn">🔁 선택 구간 반복 재생</button>
    </div>
    <div class="info">선택 구간 길이: <b id="lenTxt">0.00초</b></div>

    <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      <div class="row between">
        <label class="check" style="padding:0"><input type="checkbox" id="cropOn"> <b>🔲 영역 자르기</b></label>
        <button class="btn small hidden" id="cropReset">전체로</button>
      </div>
      <div id="cropUI" class="hidden">
        <div class="chips" id="ratios">
          <button class="chip on" data-r="0">자유</button>
          <button class="chip" data-r="1">1:1</button>
          <button class="chip" data-r="0.8">4:5</button>
          <button class="chip" data-r="0.5625">9:16</button>
          <button class="chip" data-r="1.7778">16:9</button>
          <button class="chip" data-r="1.3333">4:3</button>
        </div>
        <div class="info">영상 위의 네모를 끌어서 옮기고, 모서리 동그라미로 크기를 바꾸세요. 선택한 영역: <b id="cropTxt"></b></div>
      </div>
    </div>
  </div>

  <!-- 3. 설정 -->
  <div id="settings" class="card hidden">
    <h2>⚙️ 변환 설정</h2>
    <div class="grid">
      <div class="field">
        <label>초당 프레임 (FPS)</label>
        <select id="fps">
          <option value="0" selected>원본 (자동)</option>
          <option>5</option><option>8</option><option>10</option><option>12</option>
          <option>15</option><option>20</option><option>24</option><option>30</option>
        </select>
      </div>
      <div class="field">
        <label>가로 크기</label>
        <select id="width">
          <option value="0">원본</option><option value="1080">1080px</option><option value="720">720px</option>
          <option value="540">540px</option><option value="480" selected>480px</option><option value="360">360px</option>
          <option value="320">320px</option><option value="240">240px</option>
        </select>
      </div>
      <div class="field">
        <label>화질</label>
        <select id="quality">
          <option value="0.5">낮음 (용량↓)</option><option value="0.7">보통</option>
          <option value="0.8" selected>좋음</option><option value="0.92">매우 좋음</option>
          <option value="1">최고</option>
        </select>
      </div>
      <div class="field">
        <label>재생 속도</label>
        <select id="speed">
          <option value="0.5">0.5배 (느리게)</option><option value="0.75">0.75배</option>
          <option value="1" selected>1배</option><option value="1.5">1.5배</option>
          <option value="2">2배</option><option value="3">3배</option>
        </select>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="loop" checked> 무한 반복 재생</label>
    <label class="check"><input type="checkbox" id="boomerang"> 부메랑 (앞으로 → 뒤로 왕복)</label>
    <div class="info" id="estimate"></div>

    <div style="margin-top:12px">
      <button class="btn primary" id="convertBtn">WebP로 변환하기</button>
    </div>
    <div id="progressWrap" class="hidden">
      <div class="bar"><div id="bar"></div></div>
      <div class="row between">
        <span class="label" id="progTxt">준비 중…</span>
        <button class="btn small" id="cancelBtn">취소</button>
      </div>
    </div>
  </div>

  <!-- 4. 결과 -->
  <div id="result" class="card result hidden">
    <h2>✅ 결과</h2>
    <img id="outImg" alt="변환된 WebP">
    <div class="info" id="outInfo" style="text-align:center;margin-bottom:10px"></div>
    <button class="btn primary" id="saveBtn">💾 WebP 저장</button>
    <div class="info" id="saveHint"></div>
  </div>
</main>
<div id="toast" class="toast hidden"></div>

<script src="mp4box.all.min.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video');
  let srcURL = null, fileBase = 'video', dur = 0;
  let start = 0, end = 0, loopPlay = false;
  let outBlob = null, outURL = null, cancelled = false, busy = false;
  let srcFps = null, fpsDetecting = false, detectToken = 0, fpsPromise = null;

  // 프레임 비교용 서명 (같은 프레임이면 같은 값)
  function frameSig(ctx, w, h) {
    const d = ctx.getImageData(0, 0, w, h).data;
    let a = 0, b = 0;
    for (let k = 0; k < d.length; k += 4 * 5) {
      a = (a + d[k] + d[k + 1] * 3 + d[k + 2] * 7) | 0;
      b = (Math.imul(b, 31) + d[k + 1]) | 0;
    }
    return a + ':' + b;
  }

  // 원본 영상의 FPS를 실제 재생 프레임 간격으로 측정
  async function detectFps(url, t0) {
    const v = hiddenVideo(url);
    if (!('requestVideoFrameCallback' in v)) { dropVideo(v); return null; }
    try {
      await new Promise((res, rej) => {
        v.addEventListener('loadeddata', res, { once: true });
        v.addEventListener('error', rej, { once: true });
        setTimeout(rej, 5000);
      });
      await seekTo(v, t0);
      const times = [];
      await new Promise(res => {
        const to = setTimeout(res, 3000);
        const cb = (now, md) => {
          times.push(md.mediaTime);
          if (times.length >= 25) { clearTimeout(to); res(); } else v.requestVideoFrameCallback(cb);
        };
        v.requestVideoFrameCallback(cb);
        v.play().catch(() => { clearTimeout(to); res(); });
      });
      v.pause();
      const d = [];
      for (let i = 1; i < times.length; i++) { const x = times[i] - times[i - 1]; if (x > 0.004 && x < 0.5) d.push(x); }
      if (d.length < 5) return null;
      d.sort((a, b) => a - b);
      const q = d[Math.floor(d.length * 0.1)]; // 재생 중 빠진 프레임(간격 2배 이상)은 무시하고 가장 짧은 간격 기준
      let fps = 1 / q;
      const common = [10, 12, 15, 20, 23.976, 24, 25, 29.97, 30, 48, 50, 59.94, 60, 90, 120];
      let best = null;
      for (const c of common) if (Math.abs(c - fps) / c < 0.05 && (!best || Math.abs(c - fps) < Math.abs(best - fps))) best = c;
      fps = best || Math.round(fps);
      return fps >= 1 && fps <= 240 ? fps : null;
    } catch (e) { return null; }
    finally { dropVideo(v); }
  }

  // ---- 지원 확인 ----
  const testC = document.createElement('canvas'); testC.width = testC.height = 2;
  const webpOK = testC.toDataURL('image/webp').startsWith('data:image/webp');
  if (!webpOK) { $('unsupported').classList.remove('hidden'); }

  const fmt = t => (Math.max(0, t)).toFixed(2) + '초';
  function toast(msg, ms = 2200) {
    const el = $('toast'); el.textContent = msg; el.classList.remove('hidden');
    clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add('hidden'), ms);
  }

  // ---- 파일 선택 ----
  function loadVideoBlob(f, name) {
    if (srcURL) URL.revokeObjectURL(srcURL);
    srcURL = URL.createObjectURL(f);
    fileBase = (name || 'video').replace(/\.[^.]+$/, '') || 'video';
    $('fileInfo').textContent = `${name} · ${(f.size / 1048576).toFixed(1)}MB`;
    $('fileInfo').classList.remove('hidden');
    video.src = srcURL;
    startMeta(f);
    video.load();
    $('result').classList.add('hidden');
  }
  $('file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    loadVideoBlob(f, f.name || 'video');
  });

  // ---- 트위터(X) ----
  function tweetId(str) {
    str = (str || '').trim();
    const m = str.match(/status(?:es)?\/(\d{5,25})/i);
    if (m) return m[1];
    if (/^\d{5,25}$/.test(str)) return str;
    return null;
  }
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function dimsFromUrl(u) { const m = String(u).match(/\/(\d{2,5})x(\d{2,5})\//); return m ? { w: +m[1], h: +m[2] } : {}; }
  function normVariants(list, fallback) {
    let out = (list || []).filter(v => v && v.url && (/mp4/i.test(v.content_type || v.container || '') || /\.mp4(\?|$)/i.test(v.url)))
      .map(v => { const d = dimsFromUrl(v.url); return { url: v.url, bitrate: v.bitrate || v.bit_rate || 0, w: d.w || v.width, h: d.h || v.height }; });
    if (!out.length && fallback && fallback.url) {
      const d = dimsFromUrl(fallback.url);
      out = [{ url: fallback.url, bitrate: 0, w: d.w || fallback.w, h: d.h || fallback.h }];
    }
    const seen = new Set();
    out = out.filter(v => !seen.has(v.url) && seen.add(v.url));
    out.sort((a, b) => (b.bitrate - a.bitrate) || ((b.h || 0) - (a.h || 0)));
    return out;
  }
  async function fetchJSON(url) {
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    let j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok && !j) throw new Error('HTTP ' + r.status);
    return j || {};
  }
  async function getTweetVideos(id) {
    const errs = [];
    // 1) FxTwitter
    try {
      const j = await fetchJSON(`https://api.fxtwitter.com/status/${id}`);
      const t = j.tweet || j.status;
      if (t) {
        const media = t.media || {};
        let vids = media.videos || (media.all || []).filter(m => /video|gif/.test(m.type));
        vids = (vids || []).map(v => ({
          thumb: v.thumbnail_url || v.thumbnail, isGif: v.type === 'gif',
          variants: normVariants(v.variants || v.formats, { url: v.url, w: v.width, h: v.height })
        })).filter(v => v.variants.length);
        return { user: t.author && (t.author.screen_name || t.author.name), text: t.text || (t.raw_text && t.raw_text.text) || '', videos: vids };
      }
      errs.push(j.message || 'FxTwitter 응답 없음');
    } catch (e) { errs.push('FxTwitter: ' + e.message); }
    // 2) vxTwitter
    try {
      const j = await fetchJSON(`https://api.vxtwitter.com/i/status/${id}`);
      const list = (j.media_extended || []).filter(m => /video|gif/.test(m.type));
      if (j.tweetID || list.length) {
        return {
          user: j.user_screen_name, text: j.text || '',
          videos: list.map(m => ({ thumb: m.thumbnail_url, isGif: m.type === 'gif',
            variants: normVariants([], { url: m.url, w: m.size && m.size.width, h: m.size && m.size.height }) }))
        };
      }
      errs.push(j.error || 'vxTwitter 응답 없음');
    } catch (e) { errs.push('vxTwitter: ' + e.message); }

        else $('saveHint').textContent = '여기서는 저장할 수 없습니다. 위 이미지를 길게 눌러 저장해 보세요.';
      }
      return;
    }
    // 일반 브라우저에서 직접 열었을 때
    try {
      saveBlob(outBlob, name);
      $('saveHint').textContent = '다운로드가 시작되지 않으면 위 이미지를 길게 눌러 저장하세요.';
    } catch (e) {
      $('saveHint').textContent = '위 이미지를 길게 눌러 저장하세요.';
    }
  };
})();
</script>
</body>
</html>
