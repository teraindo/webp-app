name: 사진 이름 바꾸기 APK 빌드

on:
  push:
    paths:
      - "android-renamer/**"
      - ".github/workflows/android-renamer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle -p android-renamer assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-renamer/app/build/outputs/apk/debug/app-debug.apk image-renamer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: image-renamer
          path: image-renamer.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: image-renamer
          name: 사진 이름 바꾸기 (안드로이드 앱)
          body: |
            아래 Assets에서 image-renamer.apk를 받아 설치하세요.
            빌드: ${{ github.sha }}
          files: image-renamer.apk
          make_latest: false
